services:
  mlflow:
    image: 097155545354.dkr.ecr.ap-south-1.amazonaws.com/moon-fl-mlflow:latest
    ports:
      - "5000:5000"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_ENDPOINT=${DB_ENDPOINT}
      - DB_NAME=${DB_NAME}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    command: >
      mlflow server 
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${DB_USER}:${DB_PASSWORD}@${DB_ENDPOINT}:5432/${DB_NAME}
      --default-artifact-root s3://${S3_BUCKET_NAME}/mlflow
    logging:
      driver: awslogs
      options:
        awslogs-group: /moon-fl/mlflow
        awslogs-region: ap-south-1
        awslogs-stream: mlflow
    restart: unless-stopped
  superlink:
    image: 097155545354.dkr.ecr.ap-south-1.amazonaws.com/moon-fl-server:latest
    ports:
      - "9091:9091"
      - "9092:9092"
      - "9093:9093"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    logging:
      driver: awslogs
      options:
        awslogs-group: /moon-fl/superlink
        awslogs-region: ap-south-1
        awslogs-stream: superlink
    restart: unless-stopped