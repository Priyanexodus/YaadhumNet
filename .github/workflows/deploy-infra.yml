name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

env:
  AWS_REGION:       ap-south-1
  TF_WORKING_DIR:   infra/live
  TF_VERSION:       1.7.0

jobs:
  ###############################################################################
  # Job 1 — Plan
  ###############################################################################
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'deploy' }}

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_grafana_password: ${{ secrets.TF_VAR_GRAFANA_PASSWORD }}
          TF_VAR_db_password:    ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_key_pair_name:  ${{ secrets.TF_VAR_KEY_PAIR_NAME }}
          TF_VAR_my_ip_cidr:     ${{ secrets.TF_VAR_MY_IP_CIDR }}
        run: |
          terraform plan -out=tfplan -detailed-exitcode 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan_output.txt
          retention-days: 1

      - name: Post plan summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "### Terraform Plan Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  ###############################################################################
  # Job 2 — Manual Approval
  ###############################################################################
  approve:
    name: Manual Approval
    runs-on: ubuntu-latest 
    needs: plan
    environment: production    # ← GitHub environment with required reviewers

    steps:
      - name: Awaiting approval
        run: echo "Plan approved — proceeding with apply"

  ###############################################################################
  # Job 3 — Apply
  ###############################################################################
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: approve

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_grafana_password: ${{ secrets.TF_VAR_GRAFANA_PASSWORD }}
          TF_VAR_db_password:    ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_key_pair_name:  ${{ secrets.TF_VAR_KEY_PAIR_NAME }}
          TF_VAR_my_ip_cidr:     ${{ secrets.TF_VAR_MY_IP_CIDR }}
        run: terraform apply -auto-approve tfplan

      - name: Post apply summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          terraform output -json | jq -r 'to_entries[] | "| \(.key) | \(.value.value) |"' >> $GITHUB_STEP_SUMMARY