name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'moon_fl/**'
      - 'pyproject.toml'
      - 'uv.lock'

env:
  AWS_REGION:     ap-south-1
  AWS_ACCOUNT_ID: 097155545354
  ECR_REGISTRY:   097155545354.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      ###########################################################################
      # 1. Checkout
      ###########################################################################
      - name: Checkout code
        uses: actions/checkout@v4

      ###########################################################################
      # 2. Docker Buildx — required for GHA cache backend
      ###########################################################################
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      ###########################################################################
      # 3. AWS credentials
      ###########################################################################
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      ###########################################################################
      # 4. ECR login
      ###########################################################################
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      ###########################################################################
      # 5. Fetch ca.crt from Secrets Manager
      #    Required to bake into docker/client/Dockerfile at build time
      ###########################################################################
      - name: Fetch CA certificate from Secrets Manager
        run: |
          mkdir -p certs
          aws secretsmanager get-secret-value \
            --region ${{ env.AWS_REGION }} \
            --secret-id moon-fl/certs/ca-crt \
            --query SecretString \
            --output text > certs/ca.crt

      ###########################################################################
      # 6. Build + push moon-fl-server
      ###########################################################################
      - name: Build and push moon-fl-server
        uses: docker/build-push-action@v5
        with:
          context:   .
          file:      docker/server/Dockerfile
          push:      true
          tags: |
            ${{ env.ECR_REGISTRY }}/moon-fl-server:latest
            ${{ env.ECR_REGISTRY }}/moon-fl-server:${{ github.sha }}
          cache-from: type=gha,scope=moon-fl-server
          cache-to:   type=gha,scope=moon-fl-server,mode=max

      ###########################################################################
      # 7. Build + push moon-fl-mlflow
      ###########################################################################
      - name: Build and push moon-fl-mlflow
        uses: docker/build-push-action@v5
        with:
          context:   .
          file:      docker/mlflow/Dockerfile
          push:      true
          tags: |
            ${{ env.ECR_REGISTRY }}/moon-fl-mlflow:latest
            ${{ env.ECR_REGISTRY }}/moon-fl-mlflow:${{ github.sha }}
          cache-from: type=gha,scope=moon-fl-mlflow
          cache-to:   type=gha,scope=moon-fl-mlflow,mode=max

      ###########################################################################
      # 8. Build + push moon-fl-client (ca.crt baked in)
      ###########################################################################
      - name: Build and push moon-fl-client
        uses: docker/build-push-action@v5
        with:
          context:   .
          file:      docker/client/Dockerfile
          push:      true
          tags: |
            ${{ env.ECR_REGISTRY }}/moon-fl-client:latest
            ${{ env.ECR_REGISTRY }}/moon-fl-client:${{ github.sha }}
          cache-from: type=gha,scope=moon-fl-client
          cache-to:   type=gha,scope=moon-fl-client,mode=max

      ###########################################################################
      # 9. Summary
      ###########################################################################
      - name: Print image tags
        run: |
          echo "### Images pushed" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| moon-fl-server  | \`latest\`, \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| moon-fl-mlflow  | \`latest\`, \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| moon-fl-client  | \`latest\`, \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ca.crt fetched from Secrets Manager and baked into moon-fl-client ✅" >> $GITHUB_STEP_SUMMARY